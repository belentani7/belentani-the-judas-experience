{% block title %}UPLINK{% endblock %}
{% block body %}
<div class="glass auth-card">
  <p class="kicker">AUTH PROTOCOL</p>
  <h2>Uplink</h2>

    <input class="field" type="email" name="email" placeholder="email" required />

  </form>
  <p><a href="/auth/register">Create node</a></p>
  <p class="kicker">studio@belentani.es · omega432</p>
</div>
{% endblock %}
