{% extends "base.html" %}
{% block title %}REGISTER NODE{% endblock %}
{% block body %}
<div class="glass auth-card">
  <p class="kicker">NEW AGENT</p>
  <h2>Register</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <input class="field" name="display_name" placeholder="nombre" required />
    <input class="field" type="email" name="email" placeholder="email" required />
    <input class="field" type="password" name="password" placeholder="key" required />
    <button class="btn" type="submit">Spawn node</button>
  </form>
</div>
{% endblock %}
